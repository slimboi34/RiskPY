version: 2

# Weekly, one grouped PR per ecosystem. The workflows pin every action to a commit SHA
# with the tag in a trailing comment; Dependabot updates both. A short cooldown means a
# release has been public for a few days (time for a bad one to be pulled) before it is
# proposed here.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # pyproject.toml: the build requirement (maturin) and the extras.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]

  # rust/Cargo.toml + Cargo.lock: the Rust core's crates (pyo3, libm, zip, getrandom).
  - package-ecosystem: cargo
    directory: "/rust"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      rust:
        patterns: ["*"]
