version: 2

# The release pipeline is only as current as its actions. cibuildwheel had drifted
# from 2.22 to 4.1.1 (roughly two years) before anyone noticed, which is exactly the
# kind of silent staleness this catches.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["ci"]
    commit-message:
      prefix: "ci"
    groups:
      # One PR for routine action bumps instead of five.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
