# Build the documentation site and publish it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that every push to main republishes.
#
# The gallery is regenerated from the real library on every build, so the charts
# on the site can never drift from the code — and a broken riskpy.mc or
# riskpy.viz fails the build here rather than shipping a stale picture.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'riskpy/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The docs need the compiled extension only because riskpy/__init__.py
      # imports it eagerly. Building from source here keeps the site honest:
      # if the wheel does not build, the docs do not publish.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[docs]

      - name: Render the chart gallery
        run: python docs/generate_gallery.py

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
