# Build the documentation site and publish it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that every push to main republishes.
#
# The gallery is regenerated from the real library on every build, so the charts
# on the site can never drift from the code — and a broken riskpy.mc or
# riskpy.viz fails the build here rather than shipping a stale picture.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'riskpy/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The docs need the compiled extension only because riskpy/__init__.py
      # imports it eagerly. Building from source here keeps the site honest:
      # if the wheel does not build, the docs do not publish.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[docs]

      - name: Render the chart gallery
        run: python docs/generate_gallery.py

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the deploy job can write to Pages; the build (which runs the project's code) cannot.
    permissions:
      pages: write    # publish the uploaded artifact to Pages
      id-token: write # deploy-pages proves the run's identity with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
