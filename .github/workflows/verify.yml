# Nightly verification and benchmarks.
#
# CI already runs the verification suite on every push. This workflow runs it
# again every night with the SciPy oracle switched on and the benchmarks
# included, and keeps the JSON report as an artifact, so a slow drift in
# either accuracy or speed leaves a trail even on days nobody pushes.

name: Verify

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verification + benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build

      - name: Install with the SciPy oracle
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # Run from outside the checkout: from the repo root, the uncompiled
      # source tree would shadow the installed package. This way the suite
      # verifies exactly the artifact a user installs.
      - name: Run the suite
        working-directory: ${{ runner.temp }}
        run: |
          python -m riskpy.verify --bench --verbose \
            --json "$GITHUB_WORKSPACE/verification.json" \
            --markdown "$GITHUB_WORKSPACE/verification.md"
          {
            echo "## Verification report"
            echo
            cat "$GITHUB_WORKSPACE/verification.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ github.run_number }}
          path: |
            verification.json
            verification.md
