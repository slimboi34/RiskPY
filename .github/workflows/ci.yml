name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to main finish its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless on ephemeral runners and cost disk.
  CARGO_INCREMENTAL: 0

# Every action is pinned to a full commit SHA with the tag in the trailing comment;
# Dependabot (.github/dependabot.yml) proposes the bumps. A tag can be moved to point
# at different code; a SHA cannot.

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # A cold Rust build plus the suite; the cap only stops a hung build burning 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Cover the ends of the supported range everywhere, and fill in the
        # middle versions on Linux only to keep the matrix cheap.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          # Key on the manifests as well as the lock, and on the interpreter: pyo3's build
          # script configures itself against the Python it builds with, and cargo's
          # fingerprint does not include the interpreter (WebCortex lost a day to a cache
          # shared across Python versions).
          key: py${{ matrix.python-version }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock') }}

      # Build the wheel exactly as a user's pip would get it (abi3, release profile) and
      # install it: tests/conftest.py strips the repository root from sys.path, so the
      # suite always runs against the installed package, never the source tree.
      - name: Build the wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist

      - name: Install the wheel and the test dependencies
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          python -m pip install "${wheel}[dev]" hypothesis mpmath

      - name: Import smoke test
        # Outside the checkout, so the uncompiled riskpy/ source cannot shadow the install.
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import riskpy, riskpy.cpp_underwriter as core; from riskpy import FactorModel, FourierTransform, LossTriangle; print(riskpy.__version__, core.__file__)"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      # The verification suite: every identity the library claims, checked
      # against closed forms and published values. A wrong number fails CI.
      - name: Verify the mathematics
        working-directory: ${{ runner.temp }}
        run: python -m riskpy.verify --no-oracle

  # The Rust core on its own: unit tests and clippy, on every platform the wheels ship for.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pyo3's build script needs an interpreter to configure against, even for clippy.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: rust-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock') }}

      # riskpy-core is plain Rust, so its tests need no Python at all.
      - name: Unit tests (riskpy-core)
        run: cargo test --manifest-path rust/Cargo.toml -p riskpy-core

      # Warnings are errors: a warning nobody fails on is a warning nobody reads.
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

  # Headless-friendly path: no Tk required for core APIs
  headless-import:
    name: Headless import (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Install (no GUI)
        # Builds the Rust core from source through maturin, as pip does from the sdist.
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Headless import must succeed
        # Run outside the repo so the local source tree cannot shadow the install
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import riskpy
          from riskpy import FactorModel, FourierTransform, MonteCarloSimulator
          assert riskpy.__version__
          print("headless OK", riskpy.__version__, riskpy.__file__)
          # UnderwritingApp may or may not load; import of package itself must not crash
          PY
