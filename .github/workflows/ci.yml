name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover the ends of the supported range everywhere, and fill in the
        # middle versions on Linux only to keep the matrix cheap.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build ccache

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja ccache || true

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        # cmake and MSVC ship on the runner image; ninja does not.
        run: python -m pip install ninja

      - name: Cache pip + ccache
        uses: actions/cache@v4
        with:
          # ccache 4.x (Ubuntu ships 4.9) writes to ~/.cache/ccache; the legacy
          # ~/.ccache is only used if it already exists, which it never does here.
          path: |
            ~/.cache/pip
            ~/.cache/ccache
            ~/Library/Caches/ccache
          # src/** is in the key because an exact-key hit never re-saves: without
          # it the compiler cache froze at the first build after a pyproject or
          # CMakeLists change, however much the C++ moved on afterwards.
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml', 'CMakeLists.txt', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install package (editable + dev)
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          # ccache is not on the Windows image; an empty launcher is a no-op.
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ runner.os == 'Windows' && '' || 'ccache' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke test
        run: |
          python -c "import riskpy; from riskpy import FactorModel, FourierTransform, LossTriangle; print(riskpy.__version__)"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      # The verification suite: every identity the library claims, checked
      # against closed forms and published values. A wrong number fails CI.
      - name: Verify the mathematics
        run: python -m riskpy.verify --no-oracle

  # Headless-friendly path: no Tk required for core APIs
  headless-import:
    name: Headless import (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build
      - name: Install (no GUI)
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Headless import must succeed
        # Run outside the repo so the local source tree cannot shadow the install
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import riskpy
          from riskpy import FactorModel, FourierTransform, MonteCarloSimulator
          assert riskpy.__version__
          print("headless OK", riskpy.__version__, riskpy.__file__)
          # UnderwritingApp may or may not load; import of package itself must not crash
          PY
