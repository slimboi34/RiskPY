name: Publish to PyPI

# Release path is one command:
#
#   make release          # bumps nothing — tags v$(version from pyproject) and pushes
#
# Pushing the tag runs this workflow, which:
#   1. guard        — refuses to build if the tag disagrees with the pyproject version,
#                     or rust/Cargo.toml's version disagrees with pyproject's
#   2. build-sdist  — `maturin sdist`, then installs from it (proves it builds from source
#                     with a Rust toolchain alone)
#   3. build-wheels — linux/x86_64 (manylinux), macos/arm64, windows/AMD64   (required)
#   4. build-wheels-extra — linux/aarch64 (manylinux), macos/x86_64          (best effort)
#   5. check-dist   — twine check --strict on every artifact (no publishing rights)
#   6. publish      — PyPI via Trusted Publishing + attestations
#   7. github-release — publishes the GitHub Release with all artifacts attached
#
# The core is Rust (PyO3, built by maturin) on the stable ABI (abi3, CPython 3.10+), so
# each platform needs ONE wheel, which serves every supported Python. The wheel matrix
# lives in this file (build-wheels / build-wheels-extra): cibuildwheel and its
# [tool.cibuildwheel] table in pyproject.toml are gone with the C++ core.
#
# The publish job holds the OIDC token (id-token: write), so it installs nothing:
# it only downloads the artifacts and runs the SHA-pinned publish action. Anything
# fetched from PyPI at run time (twine, its dependencies) runs in check-dist,
# which cannot mint a token.
#
# Every action is pinned to a full commit SHA (the tag is in the trailing comment);
# Dependabot proposes the bumps. Trusted Publishing is bound to this file's name,
# so do not rename it.
#
# One-time PyPI setup (Trusted Publisher) — no API tokens:
#   https://pypi.org/manage/project/open-riskpy/settings/publishing/
#   Owner: slimboi34  Repo: RiskPY  Workflow: publish.yml  Environment: (blank)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Upload to PyPI (off = build and check only)"
        type: boolean
        default: false
      publish_testpypi:
        description: "Upload to TestPyPI instead"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two releases of the same tag race each other to PyPI.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Fail in seconds, not after a 15-minute wheel matrix, if the tag is wrong.
  # ---------------------------------------------------------------------------
  guard:
    name: Check tag matches version
    runs-on: ubuntu-latest
    # Timeouts in this file are several times the v0.3.0 run (Windows wheels: 10 min),
    # so they only ever stop a hung job, never a slow release.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: v
        name: Compare tag to pyproject version
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $version"

          # The extension reports the Rust crate's version as riskpy.cpp_underwriter.__version__,
          # and riskpy-doctor warns when it differs from the package's: keep the two in step.
          crate=$(python3 -c "import tomllib;print(tomllib.load(open('rust/Cargo.toml','rb'))['workspace']['package']['version'])")
          echo "rust/Cargo.toml:   $crate"
          if [ "$crate" != "$version" ]; then
            echo "::error::rust/Cargo.toml version ${crate} does not match pyproject version ${version}."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "git tag:           ${GITHUB_REF_NAME}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}."
              exit 1
            fi
          fi

          if curl -sf "https://pypi.org/pypi/open-riskpy/$version/json" >/dev/null; then
            echo "::warning::open-riskpy $version is already on PyPI — upload will be skipped (skip-existing)."
          fi

  # ---------------------------------------------------------------------------
  # A broken sdist is the classic "works in CI, breaks for users on ARM" bug,
  # so build it and then actually install from it.
  # ---------------------------------------------------------------------------
  build-sdist:
    name: Build sdist
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      # Installing from the sdist compiles the Rust core, exactly as pip does on a
      # platform without a wheel.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Install from the sdist and smoke-import
        # Run from a temp dir so the source tree cannot shadow the install.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -c "import riskpy, riskpy.cpp_underwriter; from riskpy import FactorModel, FourierTransform; print('sdist OK', riskpy.__version__, riskpy.__file__)"

      - name: twine check
        run: |
          python -m pip install --upgrade twine
          twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # Required wheels — a failure here blocks the release. One abi3 wheel per
  # platform (cp310-abi3) covers CPython 3.10 and every later version.
  # ---------------------------------------------------------------------------
  build-wheels:
    name: Wheels ${{ matrix.label }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64,  label: "linux/x86_64" }
          - { os: macos-latest,   target: aarch64, label: "macos/arm64" }
          - { os: windows-latest, target: x64,     label: "windows/AMD64" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # maturin needs an interpreter to name the wheel; abi3 means any 3.10+ will do.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          # Oldest macOS the wheels claim support for (ignored off macOS).
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          # No build cache: these are the files that get published, so they are built
          # from source alone, never from a cache another run wrote.
          sccache: "false"

      - name: Install the wheel and smoke-import
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links "$GITHUB_WORKSPACE/dist" open-riskpy
          cd "$RUNNER_TEMP"
          python -c "import riskpy, riskpy.cpp_underwriter as core; from riskpy import FactorModel, FourierTransform, LossTriangle, MonteCarloSimulator; print(riskpy.__version__, core.__file__)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheels-${{ matrix.target }}-${{ matrix.os }}
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # Extra architectures. Best effort: these are a bonus for users, not a reason
  # to hold back a release, so the job is allowed to fail without blocking.
  # linux/aarch64 builds natively on an ARM runner (free on public repos) rather
  # than under QEMU; macOS x86_64 is cross-compiled on the ARM runner, which
  # Apple's toolchain does natively (GitHub has retired the Intel runners).
  # ---------------------------------------------------------------------------
  build-wheels-extra:
    name: Wheels ${{ matrix.label }} (best effort)
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: aarch64, label: "linux/aarch64", cross: false }
          - { os: macos-latest,     target: x86_64,  label: "macos/x86_64 (cross)", cross: true }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          sccache: "false"

      # A cross-compiled wheel cannot be installed on the machine that built it.
      - name: Install the wheel and smoke-import
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links "$GITHUB_WORKSPACE/dist" open-riskpy
          cd "$RUNNER_TEMP"
          python -c "import riskpy, riskpy.cpp_underwriter as core; print(riskpy.__version__, core.__file__)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheels-${{ matrix.target }}-${{ matrix.os }}
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # Metadata check on exactly what publish will upload, in a job with no
  # id-token permission: the unpinned twine install runs here, never next to
  # the publishing token.
  # ---------------------------------------------------------------------------
  check-dist:
    name: Check artifacts
    # Wait for the best-effort wheels too (they are continue-on-error, so a failure there does
    # not block the upload). Without them in `needs`, the upload raced them: 0.5.0 went out
    # without its macOS x86_64 wheels, which finished three minutes after the upload started.
    needs: [guard, build-sdist, build-wheels, build-wheels-extra]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.build-sdist.result == 'success' && needs.build-wheels.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: staging
          merge-multiple: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: twine check
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          python -m pip install --upgrade twine
          twine check --strict dist/*

  # ---------------------------------------------------------------------------
  publish:
    name: Upload to PyPI
    needs: [guard, build-sdist, build-wheels, build-wheels-extra, check-dist]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.build-sdist.result == 'success' && needs.build-wheels.result == 'success' && needs.check-dist.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Trusted Publishing (OIDC) — no API token secret
      contents: read
    steps:
      # Collects dist-sdist + every dist-wheels-* that succeeded, including
      # best-effort ones, into a single flat directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: staging
          merge-multiple: true

      # Shell only: nothing is installed in the job that holds the OIDC token.
      - name: Collect artifacts
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Artifact names are unique per build, so a plain copy is enough; `cp -n`
          # emits a portability warning per file and buries the listing.
          find staging -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -lh dist/
          test -n "$(find dist -name '*.tar.gz' -print -quit)" || { echo "::error::no sdist"; exit 1; }
          test "$(find dist -name '*.whl' | wc -l)" -ge 1 || { echo "::error::no wheels"; exit 1; }
          echo "### Artifacts for ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          (cd dist && ls -1) | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_testpypi }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

      - name: Publish to PyPI
        # Tag pushes always publish; manual runs must opt in.
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi) }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
          attestations: true
          verbose: true

  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [guard, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: staging
          merge-multiple: true

      - name: Publish release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout here, so tell gh which repo
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          {
            printf 'Install:\n\n```bash\npip install -U open-riskpy==%s\n```\n\n' "$VERSION"
            printf 'Full notes: [RELEASE_NOTES.md](https://github.com/%s/blob/main/RELEASE_NOTES.md)\n' "$GITHUB_REPOSITORY"
          } > notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "RiskPY ${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              --verify-tag
          fi
