name: Publish to PyPI

# Release path is one command:
#
#   make release          # bumps nothing — tags v$(version from pyproject) and pushes
#
# Pushing the tag runs this workflow, which:
#   1. guard        — refuses to build if the tag disagrees with pyproject version
#   2. build-sdist  — builds the sdist AND installs from it (proves it is self-contained)
#   3. build-wheels — cp310–cp314 on linux/x86_64, macos/arm64, windows/AMD64  (required)
#   4. build-wheels-extra — linux/aarch64, macos/x86_64                       (best effort)
#   5. publish      — twine check --strict, then PyPI via Trusted Publishing + attestations
#   6. github-release — publishes the GitHub Release with all artifacts attached
#
# Every action is pinned to a full commit SHA (the tag is in the trailing comment);
# Dependabot proposes the bumps. Trusted Publishing is bound to this file's name,
# so do not rename it.
#
# The wheel matrix itself lives in pyproject.toml [tool.cibuildwheel] so that
# `pipx run cibuildwheel` locally reproduces CI exactly.
#
# One-time PyPI setup (Trusted Publisher) — no API tokens:
#   https://pypi.org/manage/project/open-riskpy/settings/publishing/
#   Owner: slimboi34  Repo: RiskPY  Workflow: publish.yml  Environment: (blank)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Upload to PyPI (off = build and check only)"
        type: boolean
        default: false
      publish_testpypi:
        description: "Upload to TestPyPI instead"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two releases of the same tag race each other to PyPI.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Fail in seconds, not after a 15-minute wheel matrix, if the tag is wrong.
  # ---------------------------------------------------------------------------
  guard:
    name: Check tag matches version
    runs-on: ubuntu-latest
    # Timeouts in this file are several times the v0.3.0 run (Windows wheels: 10 min),
    # so they only ever stop a hung job, never a slow release.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: v
        name: Compare tag to pyproject version
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $version"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "git tag:           ${GITHUB_REF_NAME}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}."
              exit 1
            fi
          fi

          if curl -sf "https://pypi.org/pypi/open-riskpy/$version/json" >/dev/null; then
            echo "::warning::open-riskpy $version is already on PyPI — upload will be skipped (skip-existing)."
          fi

  # ---------------------------------------------------------------------------
  # A broken sdist is the classic "works in CI, breaks for users on ARM" bug,
  # so build it and then actually install from it.
  # ---------------------------------------------------------------------------
  build-sdist:
    name: Build sdist
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build
          python -m pip install --upgrade pip build twine

      - name: Build sdist
        run: python -m build --sdist

      - name: Install from the sdist and smoke-import
        # Run from a temp dir so the source tree cannot shadow the install.
        run: |
          set -euo pipefail
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -c "import riskpy; from riskpy import FactorModel, FourierTransform; print('sdist OK', riskpy.__version__, riskpy.__file__)"

      - name: twine check
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # Required wheels — a failure here blocks the release.
  # ---------------------------------------------------------------------------
  build-wheels:
    name: Wheels ${{ matrix.label }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  arch: x86_64, label: "linux/x86_64" }
          - { os: macos-latest,   arch: arm64,  label: "macos/arm64" }
          - { os: windows-latest, arch: AMD64,  label: "windows/AMD64" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheels-${{ matrix.arch }}-${{ matrix.os }}
          path: wheelhouse/*.whl

  # ---------------------------------------------------------------------------
  # Extra architectures. Best effort: these are a bonus for users, not a reason
  # to hold back a release, so the job is allowed to fail without blocking.
  # linux/aarch64 uses a native ARM runner (free on public repos) — QEMU
  # emulation would take hours to build OpenXLSX five times.
  # ---------------------------------------------------------------------------
  build-wheels-extra:
    name: Wheels ${{ matrix.label }} (best effort)
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, arch: aarch64, label: "linux/aarch64" }
          - { os: macos-latest,     arch: x86_64,  label: "macos/x86_64 (cross)" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheels-${{ matrix.arch }}-${{ matrix.os }}
          path: wheelhouse/*.whl

  # ---------------------------------------------------------------------------
  publish:
    name: Upload to PyPI
    # Wait for the best-effort wheels too (they are continue-on-error, so a failure there does
    # not block the upload). Without them in `needs`, the upload raced them: 0.5.0 went out
    # without its macOS x86_64 wheels, which finished three minutes after the upload started.
    needs: [guard, build-sdist, build-wheels, build-wheels-extra]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.build-sdist.result == 'success' && needs.build-wheels.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Trusted Publishing (OIDC) — no API token secret
      contents: read
    steps:
      # Collects dist-sdist + every dist-wheels-* that succeeded, including
      # best-effort ones, into a single flat directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: staging
          merge-multiple: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect and verify artifacts
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Artifact names are unique per build, so a plain copy is enough; `cp -n`
          # emits a portability warning per file and buries the listing.
          find staging -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -lh dist/
          test -n "$(find dist -name '*.tar.gz' -print -quit)" || { echo "::error::no sdist"; exit 1; }
          test "$(find dist -name '*.whl' | wc -l)" -ge 1 || { echo "::error::no wheels"; exit 1; }
          python -m pip install --upgrade twine
          twine check --strict dist/*
          echo "### Artifacts for ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          (cd dist && ls -1) | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_testpypi }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

      - name: Publish to PyPI
        # Tag pushes always publish; manual runs must opt in.
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi) }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          attestations: true
          verbose: true

  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [guard, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: staging
          merge-multiple: true

      - name: Publish release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout here, so tell gh which repo
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          {
            printf 'Install:\n\n```bash\npip install -U open-riskpy==%s\n```\n\n' "$VERSION"
            printf 'Full notes: [RELEASE_NOTES.md](https://github.com/%s/blob/main/RELEASE_NOTES.md)\n' "$GITHUB_REPOSITORY"
          } > notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "RiskPY ${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              --verify-tag
          fi
