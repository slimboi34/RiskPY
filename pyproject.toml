[build-system]
# scikit-build-core injects cmake/ninja as needed — do not list them here.
requires = [
    "scikit-build-core>=0.10.0",
    "pybind11>=2.12.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "open-riskpy"
version = "0.2.8"
description = "C++ powered actuarial and quant engine: generic Monte Carlo, risk visualisation, Black-Scholes and Heston pricing, loss triangles, Fourier aggregate loss, batch Excel export."
readme = "README.md"
# PEP 639 SPDX expression (metadata 2.4) — replaces the deprecated table form.
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Josh Harty", email = "jharty1999@gmail.com" }
]
# Matches the wheels we actually ship (cp310–cp314). Previously ">=3.8", which
# made pip on 3.8/3.9 fall through to an sdist build that needs a C++ toolchain.
requires-python = ">=3.10"
# Core C++ APIs have zero hard Python deps — keeps wheels lightweight and
# manylinux installs free of Pillow/jpeg build headaches. GUI charts pull
# matplotlib via the optional [gui] extra.
dependencies = []
keywords = [
    "actuarial",
    "insurance",
    "pricing",
    "monte-carlo",
    "reserving",
    "fft",
    "pybind11",
    "quantitative-finance",
    "black-scholes",
    "heston",
    "value-at-risk",
    "risk-management",
    "simulation",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Financial and Insurance Industry",
    "Development Status :: 4 - Beta",
]

[project.urls]
Homepage = "https://github.com/slimboi34/RiskPY"
Repository = "https://github.com/slimboi34/RiskPY"
Documentation = "https://slimboi34.github.io/RiskPY/"
Issues = "https://github.com/slimboi34/RiskPY/issues"
Changelog = "https://github.com/slimboi34/RiskPY/blob/main/RELEASE_NOTES.md"
"PyPI" = "https://pypi.org/project/open-riskpy/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
]
gui = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]
# riskpy.mc — the generic Monte Carlo engine. NumPy only: it vectorises the
# formula across trials, which is what makes 100k trials a single expression.
sim = [
    "numpy>=1.20.0",
]
# riskpy.viz — the plotting layer. Implies sim, since every chart takes a Result.
viz = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]

[tool.scikit-build]
wheel.packages = ["riskpy"]
cmake.version = ">=3.15"
cmake.build-type = "Release"
# Policy floor for older dep CMakeLists (OpenXLSX).
# Do not hard-force -G Ninja here — scikit-build-core selects Ninja when available,
# which keeps Windows (MSVC) and constrained CI images working.
cmake.args = [
    "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
]
# Isolate native build artifacts for fast rebuilds / editable installs.
build-dir = "build/{wheel_tag}"
build.verbose = false
install.strip = true
# redirect mode without auto-rebuild: import never shells out to cmake
# (avoids FileNotFoundError when cmake is not on PATH after a wheel build).
editable.mode = "redirect"
editable.rebuild = false
editable.verbose = false

# ---------------------------------------------------------------------------
# Wheel matrix. Lives here (not in the workflow) so `pipx run cibuildwheel`
# locally builds exactly what CI builds.
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
# The cp*- patterns above still match 32-bit and musl variants, so exclude them
# here: no OpenXLSX toolchain story on either.
skip = ["*-win32", "*_i686", "*-musllinux_*"]
build-verbosity = 1
# cmake + ninja are injected into the isolated build env by scikit-build-core,
# and manylinux_2_28 already ships a C++17 compiler — no yum/apt shims needed.
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2", CMAKE_ARGS = "-DCMAKE_POSITION_INDEPENDENT_CODE=ON" }
# Import-only test: manylinux has no matplotlib/Tk, so exercise the C++ core.
test-command = "python -c \"import riskpy; from riskpy import FactorModel, FourierTransform, LossTriangle, MonteCarloSimulator; print(riskpy.__version__)\""

[tool.cibuildwheel.macos]
# Oldest macOS the arm64/x86_64 wheels claim support for.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", CMAKE_BUILD_PARALLEL_LEVEL = "3", CMAKE_ARGS = "-DCMAKE_POSITION_INDEPENDENT_CODE=ON" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
