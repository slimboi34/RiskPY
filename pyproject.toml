[build-system]
# maturin compiles the Rust core (rust/) into riskpy/cpp_underwriter and packs it with
# the pure-Python riskpy/ package. Building from source needs a Rust toolchain
# (https://rustup.rs) and the platform linker it uses; no CMake, no C++ libraries.
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "open-riskpy"
version = "0.9.0"
description = "Risk and actuarial engine with a Rust core: Monte Carlo with correlation and Latin hypercube, life contingencies, claims reserving (chain ladder, Mack, bootstrap), yield curves and short-rate models, credit risk, economic capital (copulas, aggregation, Euler allocation), option pricing, stress testing, twenty-two charts, agent tools with an audit ledger, and a verification suite that checks every identity."
readme = "README.md"
# PEP 639 SPDX expression (metadata 2.4) — replaces the deprecated table form.
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Josh Harty", email = "jharty1999@gmail.com" }
]
# Matches the wheels we ship: one abi3 wheel per platform covers CPython 3.10 and
# every later version. Older Pythons would fall through to an sdist build.
requires-python = ">=3.10"
# The compiled core has zero hard Python deps — keeps wheels lightweight and
# manylinux installs free of Pillow/jpeg build headaches. GUI charts pull
# matplotlib via the optional [gui] extra.
dependencies = []
keywords = [
    "actuarial",
    "insurance",
    "pricing",
    "monte-carlo",
    "reserving",
    "fft",
    "rust",
    "quantitative-finance",
    "black-scholes",
    "heston",
    "value-at-risk",
    "risk-management",
    "simulation",
    "life-contingencies",
    "chain-ladder",
    "mack",
    "bootstrap",
    "yield-curve",
    "credit-risk",
    "merton",
    "basel",
    "copula",
    "latin-hypercube",
    "economic-capital",
    "capital-allocation",
    "stress-testing",
    "mcp",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Financial and Insurance Industry",
    "Development Status :: 4 - Beta",
]

[project.urls]
Homepage = "https://github.com/slimboi34/RiskPY"
Repository = "https://github.com/slimboi34/RiskPY"
Documentation = "https://slimboi34.github.io/RiskPY/"
Issues = "https://github.com/slimboi34/RiskPY/issues"
Changelog = "https://github.com/slimboi34/RiskPY/blob/main/RELEASE_NOTES.md"
"PyPI" = "https://pypi.org/project/open-riskpy/"

[project.scripts]
riskpy-verify = "riskpy.verify:main"
riskpy-tools = "riskpy.tools:main"
riskpy-context = "riskpy.context:main"
riskpy-mcp = "riskpy.mcp_server:main"
riskpy-doctor = "riskpy.diagnostics:main"
riskpy-explain = "riskpy.errors:main"
riskpy-audit = "riskpy.audit:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "scipy>=1.10.0",
    # Only the to_frame() tests use it, and they skip without it — so without
    # this line CI silently never exercised them.
    "pandas>=1.5.0",
    # The MCP server test needs the SDK; it skips when the SDK is absent.
    "mcp>=2; python_version >= '3.10'",
]
# riskpy-mcp — the tools over the Model Context Protocol, for Claude Code and friends.
mcp = [
    "mcp>=2",
]
gui = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]
# riskpy.mc — the generic Monte Carlo engine. NumPy only: it vectorises the
# formula across trials, which is what makes 100k trials a single expression.
sim = [
    "numpy>=1.20.0",
]
# riskpy.viz — the plotting layer. Implies sim, since every chart takes a Result.
viz = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]

[tool.maturin]
# The Rust bindings crate; its library is the extension module.
manifest-path = "rust/python/Cargo.toml"
# Installed as riskpy/cpp_underwriter.*.so (or .pyd), the path the C++ core used, so
# `riskpy.cpp_underwriter` keeps working. The pure-Python package is the riskpy/
# directory beside this file, which maturin finds on its own.
module-name = "riskpy.cpp_underwriter"
# Release builds strip debug symbols from the extension.
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
