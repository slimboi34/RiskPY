site_name: RiskPY
site_description: Risk and actuarial engine with a C++ core — Monte Carlo, life contingencies, claims reserving, yield curves, credit risk, option pricing, and a verification suite.
site_url: https://slimboi34.github.io/RiskPY/
repo_url: https://github.com/slimboi34/RiskPY
repo_name: slimboi34/RiskPY
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Dark by default, with a toggle — the charts are rendered on a dark
    # surface, so this is the mode they were designed against.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["docs"]
      check_paths: true

nav:
  - Home: index.md
  - Modelling:
      - Monte Carlo: monte-carlo.md
      - Visualisation: visualisation.md
      - Quant finance: quant.md
      - Life contingencies: life.md
      - Claims reserving: reserving.md
      - Interest rates: rates.md
      - Credit risk: credit.md
  - Verification: verification.md
  - The compiled core:
      - How it works: HOW_IT_WORKS.md
      - Tutorials: TUTORIALS.md
      - Use cases: USE_CASES.md
      - Architecture: ARCHITECTURE.md
      - API reference: API_REFERENCE.md
  - Publishing: PUBLISHING.md

exclude_docs: |
  generate_gallery.py
  assets/verification.md
